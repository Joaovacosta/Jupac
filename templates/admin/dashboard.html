{% extends "base.html" %}{% block content %}<section class="pagina"><p class="rotulo">Administração</p><h1>Publicar evento</h1><form method="post" action="/admin/eventos" class="formulario"><label>Título<input name="titulo" required minlength="3"></label><label>Descrição<textarea name="descricao" required minlength="3"></textarea></label><label>Data (opcional)<input name="data" type="date"></label><label>Horário (opcional)<input name="horario" type="time"></label><label>Local (opcional)<input name="local"></label><button class="botao" type="submit">Salvar evento</button></form><h2>Eventos cadastrados</h2>{% if eventos %}<ul>{% for evento in eventos %}<li>{{ evento.titulo }}<form class="acao-inline" method="post" action="/admin/eventos/{{ evento.id }}/excluir"><button type="submit" class="link-seta">Excluir</button></form></li>{% endfor %}</ul>{% else %}<p>Nenhum evento cadastrado.</p>{% endif %}<form method="post" action="/admin/sair"><button class="link-seta" type="submit">Sair do painel</button></form></section>{% endblock %}
