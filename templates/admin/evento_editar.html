{% extends "base.html" %}{% block content %}<section class="pagina"><p class="rotulo">Administração</p><h1>Editar evento</h1><form method="post" class="formulario"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Título<input name="titulo" value="{{ evento.titulo }}" required minlength="3"></label><label>Descrição<textarea name="descricao" required minlength="3">{{ evento.descricao }}</textarea></label><label>Data (opcional)<input name="data" type="date" value="{{ evento.data.isoformat() if evento.data else '' }}"></label><label>Horário (opcional)<input name="horario" type="time" value="{{ evento.horario.strftime('%H:%M') if evento.horario else '' }}"></label><label>Local (opcional)<input name="local" value="{{ evento.local or '' }}"></label><label>Link oficial (opcional)<input name="link" type="url" value="{{ evento.link or '' }}"></label><label>Situação<select name="situacao"><option value="proximo" {% if evento.situacao == 'proximo' %}selected{% endif %}>Próximo</option><option value="realizado" {% if evento.situacao == 'realizado' %}selected{% endif %}>Realizado</option><option value="cancelado" {% if evento.situacao == 'cancelado' %}selected{% endif %}>Cancelado</option></select></label><button class="botao" type="submit">Atualizar evento</button></form><a class="link-seta" href="/admin">← Voltar ao painel</a></section>{% endblock %}
